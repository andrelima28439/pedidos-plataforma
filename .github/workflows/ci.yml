name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Subir infra para testes (Postgres, Mongo, Redis, Kafka, RabbitMQ, LocalStack)
        run: |
          docker compose up -d postgres mongodb redis kafka rabbitmq localstack
          for i in $(seq 1 36); do
            UNHEALTHY=$(docker compose ps --format '{{.Health}}' | grep -cv healthy || true)
            if [ "$UNHEALTHY" = "0" ]; then echo "infra healthy"; break; fi
            sleep 10
          done
          docker compose ps

      - name: Spotless check (formatter/linter backend)
        run: mvn -B spotless:check

      - name: Build + testes + cobertura JaCoCo
        run: mvn -B verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/*.txt'

      - name: Publicar cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/jacoco.xml'

      - name: Derrubar infra
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar jars
        run: mvn -B -q package -DskipTests

      - name: Build imagens Docker (bonus)
        run: |
          docker build -f estoque-service/Dockerfile -t estoque-service:ci ./estoque-service
          docker build -f pedido-service/Dockerfile -t pedido-service:ci ./pedido-service
          docker build -f pagamento-service/Dockerfile -t pagamento-service:ci ./pagamento-service
          docker build -f notificacao-service/Dockerfile -t notificacao-service:ci ./notificacao-service
          docker images | grep -E 'estoque-service|pedido-service|pagamento-service|notificacao-service'
